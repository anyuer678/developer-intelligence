[build-system]
requires = ["setuptools>=68"]
 build-backend = "setuptools.build_meta"

[pro ject]
name = "repo-intel-core"
version = "0.1 .0a0"
description = "Turn any repository into  a structured, versioned RepoProfile JSON —  static heuristics only, no LLM, no network." 
readme = "README.md"
license = { text = "GPL -3.0-only" }
authors = [{ name = "anyuer678"  }]
requires-python = ">=3.11"
keywords = ["co de-analysis", "static-analysis", "repo-profil e", "developer-tools"]
classifiers = [
    "D evelopment Status :: 3 - Alpha",
    "Environ ment :: Console",
    "Programming Language : : Python :: 3.11",
    "Programming Language  :: Python :: 3.12",
    "Topic :: Software De velopment :: Quality Assurance",
]
dependenci es = [
    "pydantic>=2.7",
    "PyYAML>=6.0" ,
]

[project.optional-dependencies]
dev = [
     "pytest>=8.0",
    "ruff>=0.6",
]
arch =  [
    "tree-sitter>=0.21",
    "tree-sitter-p ython>=0.21",
    "tree-sitter-go>=0.21",
     "tree-sitter-typescript>=0.21",
    "tree-si tter-javascript>=0.21",
    "tree-sitter-java >=0.21",
]

[project.scripts]
repo-intel = "r epo_intel.cli:main"

[tool.setuptools.package s.find]
where = ["src"]

[tool.setuptools.pac kage-data]
repo_intel = ["rules/*.yaml"]

[to ol.ruff]
line-length = 100
target-version = " py311"

[tool.ruff.lint]
select = ["E", "F",  "I", "UP", "B"]

[tool.pytest.ini_options]
te stpaths = ["tests"]
addopts = "-q"
 