[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-intel-core"
version = "0.1.0a0"
description = "Turn any repository into a structured, versioned RepoProfile JSON — static heuristics only, no LLM, no network."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "anyuer678" }]
requires-python = ">=3.11"
keywords = ["code-analysis", "static-analysis", "repo-profile", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
arch = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-java>=0.21",
]

[project.scripts]
repo-intel = "repo_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_intel = ["rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
