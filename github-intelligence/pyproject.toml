[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgi"
version = "0.0.1a0"
description = "Personal GitHub Intelligence — local-first analysis of your GitHub world."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "anyuer678" }]
requires-python = ">=3.11"

[project.scripts]
pgi = "pgi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
