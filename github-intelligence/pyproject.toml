[build-system]
requires = ["setuptools>=68"]
 build-backend = "setuptools.build_meta"

[pro ject]
name = "pgi"
version = "0.0.1a0"
descri ption = "Personal GitHub Intelligence — loc al-first analysis of your GitHub world."
read me = "README.md"
license = { text = "GPL-3.0- only" }
authors = [{ name = "anyuer678" }]
re quires-python = ">=3.11"

[project.scripts]
p gi = "pgi.cli:main"

[project.optional-depend encies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[ tool.setuptools.packages.find]
where = ["src" ]

[tool.pytest.ini_options]
testpaths = ["te sts"]
addopts = "-q"

[tool.ruff]
line-length  = 100
target-version = "py311"

[tool.ruff.l int]
select = ["E", "F", "I", "UP", "B"]
 