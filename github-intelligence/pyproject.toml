[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgi"
version = "0.0.1a0"
description = "Personal GitHub Intelligence — local-first analysis of your GitHub world."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "anyuer678" }]
requires-python = ">=3.11"

[project.scripts]
pgi = "pgi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]


[project.urls]
Repository = "https://github.com/anyuer678/developer-intelligence"
Issues = "https://github.com/anyuer678/developer-intelligence/issues"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgi = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
