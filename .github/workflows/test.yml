name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [repo-intel-core, github-intelligence, repo-onboarding-skill, repo-architect-skill]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ matrix.project }}[dev]" || pip install -e "${{ matrix.project }}"
          pip install pytest

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest ${{ matrix.project }}/tests/ -v --tb=short 2>&1 | tee pytest-output.log

      - name: Publish test output
        if: failure()
        run: |
          echo "## Test Output (${{ matrix.project }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 pytest-output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
